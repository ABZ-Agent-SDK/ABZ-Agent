[project]
name = "abz-agents"
version = "0.5.2"
description = "The fastest way to build AI agents using Google Gemini & Groq"
readme = "README.md"
authors = [
    { name = "Abu Bakar", email = "abubakarbinzohaib@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "typing-extensions>=4.12.0; python_version < '3.11'",
    "groq",
]

[project.scripts]
abz-agents = "abzagent.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abzagent"
module-root = ""

[dependency-groups]
dev = [
    "setuptools>=83.0.0",
    "twine>=7.0.0",
    "wheel>=0.47.0",
]
